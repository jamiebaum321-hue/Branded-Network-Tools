name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm test
      - name: Verify desktop and mobile workflows in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/branded-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.56.1
          NODE_PATH="$RUNNER_TEMP/branded-browser/node_modules" BNT_SMOKE_CHROMIUM="$(command -v google-chrome)" npm run test:browser
